name: Sync post thumbnails to admin

# 공개 사이트 썸네일(Elevate.Web/src/assets/post-thumbs)이 main에 병합되면 관리자 배포 브랜치(admin)에도
# 같은 파일만 맞추고 관리자를 다시 배포한다. 관리자 목록 카드가 이 이미지를 빌드에 포함하기 때문이다.
# main의 다른 변경은 admin으로 가져오지 않는다 (관리자 코드 배포는 기존처럼 main → admin 병합).

on:
    push:
        branches: [main]
        paths:
            - "Elevate.Web/src/assets/post-thumbs/**"
    workflow_dispatch:

permissions: {}

concurrency:
    group: sync-admin-thumbnails
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: admin
                  fetch-depth: 0

            - name: Copy post thumbnails from main
              id: sync
              run: |
                  git fetch --quiet origin main
                  git checkout origin/main -- Elevate.Web/src/assets/post-thumbs
                  if git diff --cached --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "admin에 이미 같은 썸네일이 있습니다."
                      exit 0
                  fi
                  git diff --cached --stat
                  git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                      commit --quiet -m "Sync post thumbnails from main" -m "main $(git rev-parse --short origin/main)의 공개 사이트 썸네일을 관리자 배포 브랜치에 맞춘다."
                  git push --quiet origin HEAD:admin
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            # GITHUB_TOKEN으로 push한 커밋은 다른 workflow를 깨우지 않으므로 관리자 배포를 직접 실행한다.
            - name: Deploy admin
              if: steps.sync.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run deploy-admin-azure-swa.yml --ref admin --repo "$GITHUB_REPOSITORY"
