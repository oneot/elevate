name: Post thumbnails

# 공개 사이트에 새로 게시된 글과 내용이 바뀐 글의 카드 썸네일을 AI(GitHub Copilot CLI)가 본문 전체를 읽고 만들어 PR로 올린다.
# 관리자에서 글을 '게시'로 저장하면 'Post thumbnails on save'가 마지막 저장 몇 분 뒤 이 workflow를 실행한다. 수동 실행도 된다.
# 정기 실행은 두지 않는다(글이 없는 동안 실행 기록이 쌓이지 않고, 공개 저장소의 60일 비활성 자동 중지도 받지 않는다).
# merge job이 PR 브랜치에서 'Repository checks'를 실행해 통과한 PR만 자동으로 병합하고, 공개 사이트 배포와
# 'Sync post thumbnails to admin'(관리자 배포)을 직접 실행한다. 저장소 변수 THUMBNAIL_AUTO_MERGE=false이면 사람이 병합한다.
# 생성(AI) job은 저장소 읽기 권한만 가지며, 검사를 통과한 결과만 별도 publish job이 PR로 올린다.
# 자세한 내용: tools/post-thumbs/README.md

on:
    workflow_dispatch:
        inputs:
            key:
                description: "다시 만들 글 <앱>/<slug> (예: m365/test). 비우면 새 글과 내용이 바뀐 글을 찾는다"
                required: false
                default: ""
            feedback:
                description: "다시 만들 때 AI에게 전할 요청 (선택)"
                required: false
                default: ""

permissions: {}

concurrency:
    group: post-thumbnails
    cancel-in-progress: false

jobs:
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: read
        outputs:
            items: ${{ steps.plan.outputs.items }}
            count: ${{ steps.plan.outputs.count }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            # 글 내용 지문을 수정 시각별로 남겨 바뀌지 않은 글의 본문을 매번 받지 않는다.
            - uses: actions/cache@v4
              with:
                  path: tools/post-thumbs/.cache
                  key: post-thumbs-hashes-${{ github.run_id }}
                  restore-keys: post-thumbs-hashes-

            - name: Find new and edited posts
              id: plan
              run: node tools/post-thumbs/plan.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  FORCE_KEY: ${{ inputs.key }}
                  MAX_PER_RUN: "2"

    generate:
        needs: plan
        if: needs.plan.outputs.count != '0'
        # 기존 썸네일과 같은 글꼴(SF Pro, Apple SD Gothic Neo)로 그리기 위해 macOS에서 실행한다.
        runs-on: macos-latest
        timeout-minutes: 45
        permissions:
            contents: read
            copilot-requests: write
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                item: ${{ fromJSON(needs.plan.outputs.items) }}
        defaults:
            run:
                working-directory: tools/post-thumbs
        env:
            KEY: ${{ matrix.item.key }}
            ID: ${{ matrix.item.id }}
            CATEGORY: ${{ matrix.item.category }}
            SLUG: ${{ matrix.item.slug }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: tools/post-thumbs/package-lock.json

            - name: Install tools
              run: |
                  npm ci
                  npx playwright install chromium
                  npm install -g @github/copilot

            - name: Prepare post
              run: node prepare.mjs "$KEY"
              env:
                  REASON: ${{ matrix.item.reason }}
                  FEEDBACK: ${{ inputs.feedback }}

            # AI가 실행할 수 있는 명령은 렌더러(thumb-render = node render.mjs)와 Copilot CLI가 읽기 전용으로 보는 명령뿐이다.
            # 파일은 이 글의 장면과 summary.md만 만들고 고칠 수 있다(셸 리디렉션도 막힘). 결과 검사는 다음 단계에서 따로 한다.
            # Copilot CLI는 git·gh 밖의 명령을 이름으로만 구분하므로(shell(node render.mjs:*)는 맞지 않음) 렌더러 전용 이름을 PATH에 둔다.
            # 쓰기 규칙은 도구가 쓰는 실제 경로(pwd -P)와 같아야 맞는다.
            # 모델은 품질을 위해 고정한다 (기본 Claude Opus 5.5, 저장소 변수 THUMBNAIL_MODEL로 바꿀 수 있다).
            - name: Design thumbnail with Copilot
              timeout-minutes: 30
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  THUMBNAIL_MODEL: ${{ vars.THUMBNAIL_MODEL || 'claude-opus-5.5' }}
              run: |
                  ROOT="$(pwd -P)"
                  BIN="$RUNNER_TEMP/thumb-bin"
                  mkdir -p "$BIN"
                  printf '#!/bin/sh\nexec node "%s/render.mjs" "$@"\n' "$ROOT" > "$BIN/thumb-render"
                  chmod +x "$BIN/thumb-render"
                  PATH="$BIN:$PATH" copilot -p "$(cat "work/$ID/task.md")" --model "$THUMBNAIL_MODEL" --no-ask-user \
                      --allow-tool='shell(thumb-render)' \
                      --allow-tool="write($ROOT/scenes/auto/$CATEGORY/$SLUG.js)" \
                      --allow-tool="write($ROOT/work/$ID/summary.md)" \
                      --share="work/$ID/transcript.md"

            - name: Validate result
              run: node validate.mjs "$KEY"

            - name: Upload thumbnail
              uses: actions/upload-artifact@v4
              with:
                  name: thumb-${{ matrix.item.id }}
                  if-no-files-found: error
                  retention-days: 7
                  path: |
                      tools/post-thumbs/scenes/auto/${{ matrix.item.category }}/${{ matrix.item.slug }}.js
                      tools/post-thumbs/sources/${{ matrix.item.category }}/${{ matrix.item.slug }}.json
                      Elevate.Web/src/assets/post-thumbs/${{ matrix.item.category }}/${{ matrix.item.slug }}-960.webp
                      Elevate.Web/src/assets/post-thumbs/${{ matrix.item.category }}/${{ matrix.item.slug }}-480.webp
                      tools/post-thumbs/work/${{ matrix.item.id }}/summary.md

            - name: Upload Copilot log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: log-${{ matrix.item.id }}
                  if-no-files-found: ignore
                  retention-days: 14
                  path: |
                      tools/post-thumbs/work/${{ matrix.item.id }}/
                      tools/post-thumbs/review/

    publish:
        needs: [plan, generate]
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
            issues: write
        outputs:
            prs: ${{ steps.publish.outputs.prs }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Download thumbnails
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  pattern: thumb-*
                  path: artifacts

            - name: Open pull requests
              id: publish
              run: node tools/post-thumbs/publish.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ITEMS: ${{ needs.plan.outputs.items }}
                  ARTIFACTS: ${{ github.workspace }}/artifacts
                  FEEDBACK: ${{ inputs.feedback }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    # 사람 없이 병합한다. publish 일부가 실패해도(실패 이슈) PR이 열린 글은 병합한다.
    # GITHUB_TOKEN으로 만든 PR에는 pull_request 검사가 돌지 않으므로 PR 브랜치에서 'Repository checks'를 직접 실행해 통과를 확인하고,
    # GITHUB_TOKEN으로 병합한 커밋은 push 이벤트를 만들지 않으므로 배포 workflow도 직접 실행한다(merge.mjs).
    merge:
        needs: publish
        if: ${{ !cancelled() && needs.publish.outputs.prs != '' && needs.publish.outputs.prs != '[]' && vars.THUMBNAIL_AUTO_MERGE != 'false' }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            actions: write
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Check and merge thumbnail pull requests
              run: node tools/post-thumbs/merge.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PRS: ${{ needs.publish.outputs.prs }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
