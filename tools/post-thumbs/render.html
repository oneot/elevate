<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Elevate thumbnails</title>
<link rel="stylesheet" href="kit.css" />
<style>
  body.review { width: 1180px; padding: 36px 48px 48px; }
  .rv-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .rv-head h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.045em; }
  .rv-head span { font-size: 15px; color: #6e6e73; }
  .rv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 28px; }
  .rv-card .thumb { width: 100%; border-radius: 16px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  .rv-body { display: flex; flex-direction: column; gap: 6px; padding: 13px 2px 0; }
  .rv-title { font-size: 17px; font-weight: 600; line-height: 1.42; letter-spacing: -0.015em; word-break: keep-all; }
  .rv-excerpt { font-size: 14px; line-height: 1.55; color: #6e6e73; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-key { font: 600 11.5px/1.3 var(--mono); color: #a1a6ad; }
  body.export { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; width: 2000px; }
  body.zoom { padding: 0; }
  body.zoom .thumb { width: 960px; }
  /* Mascot audit of GitHub AI scenes (render.mjs auditMascots): a flat green stage with no glow or fluid forms and no mascot
     shadow, so only the mascots and the UI over them change between the screenshots. Never applied to an exported image. */
  .tD.km-measure { background: #00ff00 !important; }
  .tD.km-measure::before { display: none !important; }
  .tD.km-measure > .deco { visibility: hidden !important; }
  .tD.km-measure .mascot { filter: none !important; }
  .tD.km-measure .mascot.km-hide { visibility: hidden !important; }
  .tD.km-measure .mascot.km-raise { z-index: 2147483647 !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/fluid/palette.js"></script>
<script src="kit.js"></script>
<script>
  const CATS = ['m365', 'copilot', 'copilot-studio', 'teams', 'onenote', 'forms', 'onedrive', 'powerpoint', 'excel', 'word', 'minecraft', 'github', 'azure'];
  for (const cat of CATS) document.write(`<script src="scenes/${cat}.js"><\/script>`);
</script>
<script>
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || 'review';
  const cat = q.get('cat');
  const keys = q.get('keys') ? q.get('keys').split(',') : null;
  document.body.className = mode;

  const esc = (s) => String(s || '').replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));

  // AI가 만든 장면(scenes/auto/<cat>/<slug>.js). 목록은 render.mjs의 서버가 만들어 준다.
  const loadScript = (src) => new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`failed to load ${src}`));
    document.head.append(el);
  });

  function audit() {
    const issues = [];
    document.querySelectorAll('.tD').forEach((stage) => {
      const key = stage.dataset.scene;
      const sbox = stage.getBoundingClientRect();
      // Pills and their text must sit fully inside the stage.
      stage.querySelectorAll('.pill').forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.left < sbox.left - 0.5 || r.right > sbox.right + 0.5 || r.top < sbox.top - 0.5 || r.bottom > sbox.bottom + 0.5) issues.push(`${key}: pill outside stage — "${el.textContent.trim()}"`);
      });
      // Text that is cut off on the right inside its clipping container, or overflowing a nowrap box.
      const walker = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        const text = node.textContent.trim();
        if (!text) continue;
        const el = node.parentElement;
        if (el.closest('style')) continue;
        const range = document.createRange();
        range.selectNodeContents(node);
        const r = range.getBoundingClientRect();
        if (!r.width) continue;
        const clip = el.closest('.win, .card, .phone__screen, .slide, .page, .node, .tD');
        const c = clip.getBoundingClientRect();
        const visibleV = r.bottom > c.top && r.top < c.bottom;
        if (visibleV && (r.right > c.right + 1 || r.left < c.left - 1)) issues.push(`${key}: text cut at the edge of .${clip.classList[0]} — "${text.slice(0, 40)}"`);
        if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'visible') issues.push(`${key}: text overflows its box — "${text.slice(0, 40)}"`);
      }
      if (!window.SCENES[key]) issues.push(`${key}: no scene yet`);
      else if (window.SCENES[key].auto && stage.classList.contains('fluid')) issues.push(...auditFluid(stage, key));
    });
    return issues;
  }

  // v3 rules for AI scenes (STYLE_GUIDE 'v3 플루이드'): readable at the 480px card, simple, the app tile once.
  // Scenes in scenes/<app>.js (the first 80 cards) are not held to these, so their warnings never reach the AI.
  function auditFluid(stage, key) {
    const issues = [];
    const cqw = stage.getBoundingClientRect().width / 100;
    let blocks = 0;
    let smallest = null;
    const walker = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const text = node.textContent.trim();
      const el = node.parentElement;
      if (!text || el.closest('style')) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      const r = range.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      blocks += 1;
      const size = parseFloat(getComputedStyle(el).fontSize) / cqw;
      if (size < 1.8 - 0.01 && (!smallest || size < smallest.size)) smallest = { size, text };
    }
    if (smallest) issues.push(`${key}: text smaller than 1.8cqw is unreadable on the 480px card (${smallest.size.toFixed(2)}cqw) — "${smallest.text.slice(0, 30)}"`);
    if (blocks > 16) issues.push(`${key}: ${blocks} text blocks — keep it to 12–16 (use K.skel for the rest)`);
    const count = (selector) => stage.querySelectorAll(selector).length;
    if (count('.pill') !== 1) issues.push(`${key}: ${count('.pill')} pills — use exactly one K.pill`);
    if (count('.k-tile') !== 1) issues.push(`${key}: ${count('.k-tile')} app tiles — use exactly one K.tile (the app icon tile)`);
    if (count('.k-float') > 3) issues.push(`${key}: ${count('.k-float')} floating pieces — at most 3 K.float`);
    const sbox = stage.getBoundingClientRect();
    stage.querySelectorAll('.k-tile').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.left < sbox.left - 0.5 || r.right > sbox.right + 0.5 || r.top < sbox.top - 0.5 || r.bottom > sbox.bottom + 0.5) issues.push(`${key}: app tile outside the stage`);
    });
    return issues;
  }

  // GitHub AI scenes (v3): where each mascot is and what could lie under it. render.mjs screenshots the stage with each
  // mascot raised and hidden to count the pixels where it is really seen, then judges them (lib/mascots.mjs checkMascots).
  const thumbOf = (key) => [...document.querySelectorAll('.thumb[data-key]')].find((el) => el.dataset.key === key);
  window.mascotLayout = (key) => {
    const thumb = thumbOf(key);
    const stage = thumb && thumb.querySelector('.tD');
    const scene = window.SCENES[key];
    if (!stage || !scene || !scene.auto || !stage.classList.contains('fluid') || key.split('/')[0] !== 'github') return null;
    const box = thumb.getBoundingClientRect();
    const cqw = box.width / 100;
    const rel = (r) => ({ x: r.left - box.left, y: r.top - box.top, w: r.right - r.left, h: r.bottom - r.top });
    const clip = (r, c) => {
      const left = Math.max(r.left, c.left); const top = Math.max(r.top, c.top);
      const right = Math.min(r.right, c.right); const bottom = Math.min(r.bottom, c.bottom);
      return right > left && bottom > top ? { left, top, right, bottom } : null;
    };
    const mascots = [...stage.querySelectorAll('img.mascot')].map((el) => {
      const r = el.getBoundingClientRect();
      const src = el.getAttribute('src') || '';
      // The screenshots compare the stage with itself, so a faded or blurred mascot would still count as seen.
      let opacity = 1;
      let blur = false;
      for (let n = el; n && n !== stage; n = n.parentElement) {
        const style = getComputedStyle(n);
        opacity *= Number(style.opacity);
        blur = blur || /blur\(/.test(style.filter);
      }
      // Rotation makes the box wider than the image, a CSS scale makes the image smaller than its layout width.
      return { name: (/([^/]+)\.png$/.exec(src) || [])[1] || src, w: Math.min(el.offsetWidth, r.width) / cqw, size: { w: el.offsetWidth, h: el.offsetHeight }, rect: rel(r), opacity, blur };
    });
    // Only the part of each text that can be seen: inside its clipping box and the stage.
    const texts = [];
    const walker = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const text = node.textContent.trim();
      const el = node.parentElement;
      if (!text || el.closest('style')) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      const r = range.getBoundingClientRect();
      if (!r.width || !r.height) continue;
      const seen = clip(r, el.closest('.win, .card, .phone__screen, .slide, .page, .node, .tD').getBoundingClientRect());
      const onStage = seen && clip(seen, box);
      if (onStage) texts.push({ text, rect: rel(onStage) });
    }
    const tiles = [...stage.querySelectorAll('.k-tile')].map((el) => ({ rect: rel(el.getBoundingClientRect()) }));
    return { width: box.width, height: box.height, cqw, mascots, texts, tiles, floats: stage.querySelectorAll('.k-float').length };
  };
  /** state: {} draws every mascot, { raise: i } puts mascot i on top, { hide: [i…] } hides mascots, null restores the stage. */
  window.mascotMeasure = (key, state) => {
    const stage = thumbOf(key).querySelector('.tD');
    stage.classList.toggle('km-measure', state != null);
    stage.querySelectorAll('img.mascot').forEach((el, i) => {
      el.classList.toggle('km-raise', Boolean(state && state.raise === i));
      el.classList.toggle('km-hide', Boolean(state && state.hide && state.hide.includes(i)));
    });
  };

  async function settle() {
    await document.fonts.ready;
    const imgs = [...document.images];
    await Promise.all(imgs.map((img) => (img.complete ? null : new Promise((res) => { img.onload = img.onerror = res; }))));
    // CSS mask icons: fetch each url once so they are cached before the screenshot.
    const urls = new Set();
    document.querySelectorAll('.ico').forEach((el) => {
      const m = /url\(['"]?([^'")]+)['"]?\)/.exec(el.style.getPropertyValue('--ico'));
      if (m) urls.add(m[1]);
    });
    const missing = [];
    await Promise.all([...urls].map(async (src) => {
      const res = await fetch(src);
      if (!res.ok) missing.push(src);
    }));
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    return missing;
  }

  (async () => {
    const auto = await fetch('scenes/auto/index.json').then((res) => (res.ok ? res.json() : [])).catch(() => []);
    window.AUTO_SCENES = true;
    for (const src of auto) {
      try { await loadScript(src); } catch (e) { console.error(e.message); }
    }
    window.AUTO_SCENES = false;
    const posts = await (await fetch('data/posts.json')).json();
    let list = posts;
    if (cat) list = list.filter((p) => cat.split(',').includes(p.category));
    if (keys) list = list.filter((p) => keys.includes(p.key));
    const root = document.getElementById('root');

    if (mode === 'review') {
      // 같은 앱 카드들과 비교하는 화면이므로 아직 장면이 없는 다른 새 글은 빼고 보여 준다.
      list = list.filter((p) => window.SCENES[p.key]);
      const label = cat ? cat.split(',').map((x) => (window.CAT[x] || {}).name || x).join(' · ') : '전체';
      root.innerHTML = `<header class="rv-head"><h1>${esc(label)}</h1><span>${list.length}개</span></header>
        <div class="rv-grid">${list.map((p) => `
          <article class="rv-card">
            <div class="thumb">${window.renderScene(p.key, p.category)}</div>
            <div class="rv-body"><h3 class="rv-title">${esc(p.title)}</h3><p class="rv-excerpt">${esc(p.excerpt)}</p><p class="rv-key">${esc(p.key)}</p></div>
          </article>`).join('')}</div>`;
    } else {
      root.innerHTML = list.map((p) => `<div class="thumb" data-key="${esc(p.key)}">${window.renderScene(p.key, p.category)}</div>`).join('');
    }

    const missing = await settle();
    for (const p of list) {
      const s = window.SCENES[p.key];
      if (s && s.after) {
        const stage = document.querySelector(`.tD[data-scene="${p.key}"]`);
        try { s.after(stage, window.K); } catch (e) { console.error(p.key, e); }
      }
    }
    window.AUDIT = [...missing.map((m) => `missing icon/file: ${m}`), ...audit()];
    document.body.dataset.ready = '1';
  })();
</script>
</body>
</html>
